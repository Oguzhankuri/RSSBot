site:
  name: "Benim Haber Sitem"

feeds:
  # Tam metin çekilebilen kaynaklar
  - "https://feeds.bbci.co.uk/news/world/rss.xml"                      # BBC News
  - "https://www.aljazeera.com/xml/rss/all.xml"                        # Al Jazeera
  - "https://rss.dw.com/xml/rss-en-world"                              # DW
  - "https://www.euronews.com/rss?format=mrss&level=theme&name=news"   # Euronews
  - "https://www.theguardian.com/world/rss"                            # The Guardian
  - "https://www.politico.eu/feed/"                                    # Politico Europe
  - "https://feeds.npr.org/1004/rss.xml"                               # NPR
  - "https://abcnews.go.com/abcnews/internationalheadlines"            # ABC News
  # Tam metin çekilemiyor (paywall/engel) — sadece RSS özeti; kısa özetler min_chars ile elenir
  - "https://www.france24.com/en/rss"                                  # France 24
  - "https://rss.nytimes.com/services/xml/rss/nyt/World.xml"           # New York Times
  - "https://feeds.skynews.com/feeds/rss/world.xml"                    # Sky News
  - "https://www.rfi.fr/en/rss"                                        # RFI
  - "https://feeds.washingtonpost.com/rss/world"                       # Washington Post
  # Bot koruması nedeniyle 406 veriyor, devre dışı:
  # - "https://www.cbsnews.com/latest/rss/world"                       # CBS News

ingest:
  max_items: 8             # günde kaç haber
  fetch_full_text: true    # makale sayfasından tam metni çek (trafilatura)
  dedupe: true             # state/seen.json ile tekrarı engelle
  min_chars: 200           # bundan kısa haberleri ele

rewrite:
  provider: "deepseek"
  model: "deepseek-chat"
  base_url: "https://api.deepseek.com"
  target_words: 110        # her haber senaryosu ~kaç kelime (8×110 ≈ 8 dk)
  tone: "net, tarafsız, akıcı, YouTube haber bülteni anlatımı"

translate:
  enabled: true
  languages: ["en", "de", "ar", "ru"]

images:
  provider: "flux_local"   # flux_local (Colab GPU) | fal (API)
  model_id: "black-forest-labs/FLUX.1-schnell"
  count_per_item: 3
  width: 1280
  height: 720              # 16:9
  steps: 4                 # schnell için 4 adım yeterli
  style: "modern, temiz, gerçekçi haber illüstrasyonu, sinematik ışık"
  fal_model: "fal-ai/flux/schnell"   # provider=fal ise

voice:
  enabled: true
  engine: "chatterbox"
  device: "cuda"           # GPU; yoksa "cpu" (çok yavaş)
  ref_audio: "refs/ref_voice.wav"   # kullanıcının referans sesi
  languages: ["en", "de", "ar", "ru"]   # translate.languages ile aynı olmalı
  max_chars_per_chunk: 300            # uzun metni cümlelere böl
  exaggeration: 0.5
  cfg_weight: 0.5

output:
  base_dir: "output"
  # Colab'da Drive'a yazmak için: "/content/drive/MyDrive/gunluk-bulten/output"
