# PC kapalıyken bile Telegram'dan yazdığın fikirler 15 dakikada bir Fikir Kutusu'na (Supabase) aktarılır.
# Gerekli GitHub Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_USER_ID
#   (opsiyonel) DEEPSEEK_API_KEY — fikirlere otomatik kategori/etiket için
name: telegram-fikir-senkronu

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: telegram-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BULTEN_DB_PROVIDER: supabase
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Secret kontrolü
        id: check
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Secrets tanımlı değil, atlanıyor."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Bağımlılıklar
        if: steps.check.outputs.skip != 'true'
        run: pip install requests pyyaml python-dotenv openai tzdata
      - name: Senkron
        if: steps.check.outputs.skip != 'true'
        run: python -m bulten.telegram_sync
