# SUNUCU katmanı — temel dosyanın üstüne eklenir:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.server.yml up -d
# Farklar: 80/443 dışarı açılır (HTTPS), alan adı docker/.env → SITE_ADDRESS, sertifikalar kalıcı volume'da.
services:
  gateway:
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?docker/.env içine SITE_ADDRESS=db.alanadin.com yaz}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  db:
    # Sunucuda Postgres'e ayrılan bellek sınırı (küçük VPS'lerde OOM'u önler)
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  caddy_data:
  caddy_config:
